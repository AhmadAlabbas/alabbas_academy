name: Patch release dependencies
on:
  push:
    branches: [release/academy-code-mobile-2026-11-01]
    paths: ['.github/workflows/release-dependency-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/academy-code-mobile-2026-11-01
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Pin security patched production dependencies
        working-directory: platform
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='package.json';
          const pkg=JSON.parse(readFileSync(path,'utf8'));
          Object.assign(pkg.dependencies,{
            next:'16.4.3',
            zod:'4.6.7',
            nodemailer:'10.1.4'
          });
          pkg.overrides={...pkg.overrides,'fast-uri':'3.1.9'};
          writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          NODE
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Verify production dependency audit
        working-directory: platform
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run application lint, unit tests and production build
        working-directory: platform
        run: |
          npm run db:generate
          npm run lint
          npm test
          npm run build
      - name: Commit audited version updates to release branch
        run: |
          git config user.name "academy-release-bot"
          git config user.email "academy-release-bot@users.noreply.github.com"
          git add platform/package.json platform/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes needed.'
          else
            git commit -m "Patch Next.js, Zod, Nodemailer and fast-uri for production"
            git push origin HEAD:refs/heads/release/academy-code-mobile-2026-11-01
          fi
